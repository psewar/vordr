# The Home Assistant integration: custom_components/ at the root, its tests in ha/ (ADR-0144). Run from the root:
# ruff check custom_components ha && ruff format --check custom_components ha
line-length = 120
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# German texts and arrows are intended; _attr_* lists on entity classes are Home Assistant's convention.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["custom_components"]
