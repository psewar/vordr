[pytest]
# The integration lives in custom_components/ at the root, where HACS looks for it; its tests are in ha/tests
# (ADR-0144). Run pytest from the repository root.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = ha/tests
pythonpath = .
# A socket or transport a test leaves open is a fault of the test or its fake, not noise: it surfaces later, in
# another test, as an exception asyncio raises while collecting it (FakeHub._stop in ha/tests/conftest.py).
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
